<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <h1>Image Gallery</h1>
        <p>Explore our beautiful collections</p>
    </header>

    <main>
        <!-- Filter Buttons -->
        <div class="filter-container">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="nature">Nature</button>
            <button class="filter-btn" data-filter="architecture">Architecture</button>
            <button class="filter-btn" data-filter="animals">Animals</button>
            <button class="filter-btn" data-filter="people">People</button>
            <button class="filter-btn" data-filter="travel">Travel</button>
            <button class="filter-btn" data-filter="abstract">Abstract</button>
        </div>

        <!-- Image Upload Section -->
        <div class="upload-container">
            <h3 class="upload-title"><i class="fas fa-cloud-upload-alt"></i> Add New Image</h3>
            <form id="uploadForm" class="upload-form">
                <div class="form-group">
                    <label for="imageUpload" class="file-label">
                        <i class="fas fa-image"></i> Choose Image
                        <input type="file" id="imageUpload" accept="image/*" required>
                    </label>
                    <span id="fileName" class="file-name">No file chosen</span>
                </div>
                <div class="form-group">
                    <select id="imageCategory" required class="custom-select">
                        <option value="" disabled selected>Select Category</option>
                        <option value="nature">Nature</option>
                        <option value="architecture">Architecture</option>
                        <option value="animals">Animals</option>
                        <option value="people">People</option>
                        <option value="travel">Travel</option>
                        <option value="abstract">Abstract</option>
                    </select>
                </div>
                <div class="form-group">
                    <select id="imageFilter" class="custom-select">
                        <option value="none">No Filter</option>
                        <option value="grayscale">Grayscale</option>
                        <option value="sepia">Sepia</option>
                        <option value="blur">Blur</option>
                        <option value="brightness">Brightness</option>
                        <option value="contrast">Contrast</option>
                        <option value="hue-rotate">Hue Rotate</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn"><i class="fas fa-plus"></i> Add to Gallery</button>
            </form>
        </div>

        <!-- Gallery Grid -->
        <div class="gallery-grid" id="gallery">
            <!-- Images will be inserted here via JavaScript -->
        </div>
    </main>

    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox">
        <span class="close-btn" id="closeLightbox">&times;</span>
        <button class="nav-btn prev-btn" id="prevBtn"><i class="fas fa-chevron-left"></i></button>
        <img class="lightbox-img" id="lightboxImg" src="" alt="Lightbox View">
        <button class="nav-btn next-btn" id="nextBtn"><i class="fas fa-chevron-right"></i></button>
        <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
