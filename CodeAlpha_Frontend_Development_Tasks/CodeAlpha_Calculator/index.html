<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Calculator</title>
    <meta name="description" content="A premium built glassmorphism calculator with real-time operations">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="calculator-container">
        <!-- Floating shapes for background aesthetics -->
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        
        <div class="calculator">
            <div class="calculator-header">
                <button class="header-btn" id="history-toggle-btn" aria-label="Toggle history">
                    <span class="icon">🕒</span>
                </button>
                <button class="header-btn" id="theme-btn" aria-label="Toggle theme">
                    <span class="icon">☀️</span>
                </button>
            </div>
            
            <div class="history-panel hidden" id="history-panel">
                <div class="history-panel-header">
                    <h3>History</h3>
                    <button class="clear-history-btn" id="clear-history-btn" aria-label="Clear history">🗑️</button>
                </div>
                <div class="history-list" id="history-list">
                    <!-- History items -->
                </div>
            </div>
            
            <div class="display">
                <div class="history" id="history"></div>
                <div class="current" id="current">0</div>
            </div>
            
            <div class="keypad">
                <button class="btn btn-action" data-action="clear">AC</button>
                <button class="btn btn-action" data-action="delete">⌫</button>
                <button class="btn btn-action" data-action="operator" data-value="%">%</button>
                <button class="btn btn-operator" data-action="operator" data-value="/">÷</button>
                
                <button class="btn btn-number" data-value="7">7</button>
                <button class="btn btn-number" data-value="8">8</button>
                <button class="btn btn-number" data-value="9">9</button>
                <button class="btn btn-operator" data-action="operator" data-value="*">×</button>
                
                <button class="btn btn-number" data-value="4">4</button>
                <button class="btn btn-number" data-value="5">5</button>
                <button class="btn btn-number" data-value="6">6</button>
                <button class="btn btn-operator" data-action="operator" data-value="-">−</button>
                
                <button class="btn btn-number" data-value="1">1</button>
                <button class="btn btn-number" data-value="2">2</button>
                <button class="btn btn-number" data-value="3">3</button>
                <button class="btn btn-operator" data-action="operator" data-value="+">+</button>
                
                <button class="btn btn-number" id="btn-zero" data-value="0">0</button>
                <button class="btn btn-number" data-value=".">.</button>
                <button class="btn btn-equals" data-action="calculate">=</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
