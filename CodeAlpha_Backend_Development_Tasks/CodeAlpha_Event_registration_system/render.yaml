services:
  - type: web
    name: event-registration-system
    env: node
    buildCommand: npm run install-all && npm run build:frontend
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: /api
      - key: DATABASE_URL
        fromDatabase:
          name: event-db
          property: connectionString

databases:
  - name: event-db
    databaseName: eventsdb
    user: events_admin
    plan: free
