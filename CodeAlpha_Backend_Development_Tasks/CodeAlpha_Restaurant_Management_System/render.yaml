services:
  - type: web
    name: spice-route-restaurant
    runtime: node
    rootDir: CodeAlpha_Backend_Development_Tasks/CodeAlpha_Restaurant_Management_System
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_API_KEY
        value: changeme
      - key: PORT
        value: 4000
